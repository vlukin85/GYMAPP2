name: Android release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Вариант Android-сборки"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      artifact_type:
        description: "Выходной артефакт"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab
          - both
      debug_architecture:
        description: "Архитектура debug APK"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - universal

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Run unit tests
        run: pnpm vitest run --pool=forks --poolOptions.forks.singleFork

  build-android:
    name: Build release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_variant || 'release' }}
      ARTIFACT_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_type || 'apk' }}
      DEBUG_ARCHITECTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_architecture || 'arm64-v8a' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Gradle
        # actions/cache пишется на любой ветке (в отличие от gradle/actions,
        # который на feature-ветках read-only). Пост-шаг сохраняет кэш даже
        # при отмене прогона — следующий стартует с тёплым Gradle.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', 'pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Android build dependencies
        run: |
          # android-actions/setup-android@v3 currently fails on hosted runners
          # ("Failed to find package 'tools'"), so rely on the preinstalled
          # Android SDK and point PATH at its cmdline-tools explicitly.
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate build selection
        run: |
          if [ "${BUILD_VARIANT}" = "debug" ] && [ "${ARTIFACT_TYPE}" != "apk" ]; then
            echo "AAB для Google Play собирается только в варианте release."
            exit 1
          fi

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Apply stable keystore and print SHA-1
        # ironrise.keystore закоммичен в репозитории (приватный): фиксированный
        # SHA-1 подписи — обязателен для OAuth-клиента Google (Google Fit).
        # Пароли/алиас совпадают с expo-шаблоном (android / androiddebugkey).
        run: |
          cp ironrise.keystore android/app/debug.keystore
          keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:" || true

      - name: Warm up Gradle distribution with retries
        # services.gradle.org редиректит на GitHub Releases; в последние дни
        # тот отдаёт 504/таймауты. Прогреваем дистрибутив с ретраями, чтобы
        # сама сборка не падала на скачивании.
        run: |
          cd android
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version > /dev/null 2>&1; then
              echo "Gradle distribution ready (attempt $attempt)"
              exit 0
            fi
            echo "Gradle download failed (attempt $attempt), retrying in 30s..."
            sleep 30
          done
          ./gradlew --version

      - name: Detect production signing secrets
        if: ${{ env.BUILD_VARIANT == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "SIGN_RELEASE=true" >> "${GITHUB_ENV}"
            echo "Production signing secrets are configured."
          else
            echo "SIGN_RELEASE=false" >> "${GITHUB_ENV}"
            echo "::warning::Release APK will use the generated Android signing configuration. Add production signing secrets before publishing to an app store."
          fi

      - name: Configure production signing
        if: ${{ env.SIGN_RELEASE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Не настроен обязательный GitHub Secret: ${secret_name}."
              exit 1
            fi
          done

          echo "${KEYSTORE_BASE64}" | base64 --decode > android/app/ironrise-release.keystore
          chmod 600 android/app/ironrise-release.keystore
          {
            printf 'storeFile=app/ironrise-release.keystore\n'
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD}"
          } > android/keystore.properties

          cat > android/app/ironrise-signing.gradle <<'GRADLE'
          def ironriseKeystorePropertiesFile = rootProject.file("keystore.properties")
          if (ironriseKeystorePropertiesFile.exists()) {
              def ironriseKeystoreProperties = new Properties()
              ironriseKeystorePropertiesFile.withInputStream { stream ->
                  ironriseKeystoreProperties.load(stream)
              }

              android {
                  signingConfigs {
                      release {
                          storeFile rootProject.file(ironriseKeystoreProperties["storeFile"])
                          storePassword ironriseKeystoreProperties["storePassword"]
                          keyAlias ironriseKeystoreProperties["keyAlias"]
                          keyPassword ironriseKeystoreProperties["keyPassword"]
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          GRADLE
          printf '\napply from: file("ironrise-signing.gradle")\n' >> android/app/build.gradle

      - name: Build Android artifacts
        working-directory: android
        # Ретраи: зеркала GitHub Releases периодически отдают 504/таймауты
        # на больших артефактах (kotlin-compiler и т.п.). Gradle кэширует
        # успешно скачанное, поэтому повторная попытка продолжает с места
        # обрыва, а не с нуля.
        run: |
          if [ "${BUILD_VARIANT}" = "debug" ]; then
            if [ "${DEBUG_ARCHITECTURE}" = "universal" ]; then
              GRADLE_CMD="./gradlew :app:assembleDebug --no-daemon"
            else
              GRADLE_CMD="./gradlew :app:assembleDebug -PreactNativeArchitectures=\"${DEBUG_ARCHITECTURE}\" --no-daemon"
            fi
          elif [ "${ARTIFACT_TYPE}" = "aab" ]; then
            GRADLE_CMD="./gradlew :app:bundleRelease --no-daemon"
          elif [ "${ARTIFACT_TYPE}" = "both" ]; then
            GRADLE_CMD="./gradlew :app:assembleRelease :app:bundleRelease --no-daemon"
          else
            GRADLE_CMD="./gradlew :app:assembleRelease --no-daemon"
          fi
          for attempt in 1 2 3; do
            echo "=== Сборка, попытка $attempt ==="
            if eval "$GRADLE_CMD"; then
              echo "Сборка успешна (попытка $attempt)"
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "Сборка не удалась после 3 попыток"
              exit 1
            fi
            echo "Сборка упала, повтор через 30 мин (кэш Gradle сохранён)..."
            sleep 1800
          done

      - name: Upload installable APK
        if: ${{ env.ARTIFACT_TYPE == 'apk' || env.ARTIFACT_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ironrise-${{ env.BUILD_VARIANT }}-apk
          path: android/app/build/outputs/apk/${{ env.BUILD_VARIANT }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android App Bundle
        if: ${{ env.ARTIFACT_TYPE == 'aab' || env.ARTIFACT_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ironrise-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
