name: Android build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "assets/**"
      - "components/**"
      - "lib/**"
      - "modules/**"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Вариант Android-сборки"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      artifact_type:
        description: "Выходной артефакт"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab
          - both

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Run unit tests
        run: pnpm vitest run --pool=forks --poolOptions.forks.singleFork

  build-android:
    name: Build Android artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_variant || 'debug' }}
      ARTIFACT_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_type || 'apk' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate build selection
        run: |
          if [ "${BUILD_VARIANT}" = "debug" ] && [ "${ARTIFACT_TYPE}" != "apk" ]; then
            echo "AAB для Google Play собирается только в варианте release."
            exit 1
          fi

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Configure production signing
        if: ${{ env.ARTIFACT_TYPE == 'aab' || env.ARTIFACT_TYPE == 'both' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Не настроен обязательный GitHub Secret: ${secret_name}."
              exit 1
            fi
          done

          echo "${KEYSTORE_BASE64}" | base64 --decode > android/app/ironrise-release.keystore
          chmod 600 android/app/ironrise-release.keystore
          {
            printf 'storeFile=app/ironrise-release.keystore\n'
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD}"
          } > android/keystore.properties

          cat > android/app/ironrise-signing.gradle <<'GRADLE'
          def ironriseKeystorePropertiesFile = rootProject.file("keystore.properties")
          if (ironriseKeystorePropertiesFile.exists()) {
              def ironriseKeystoreProperties = new Properties()
              ironriseKeystorePropertiesFile.withInputStream { stream ->
                  ironriseKeystoreProperties.load(stream)
              }

              android {
                  signingConfigs {
                      release {
                          storeFile rootProject.file(ironriseKeystoreProperties["storeFile"])
                          storePassword ironriseKeystoreProperties["storePassword"]
                          keyAlias ironriseKeystoreProperties["keyAlias"]
                          keyPassword ironriseKeystoreProperties["keyPassword"]
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          GRADLE
          printf '\napply from: file("ironrise-signing.gradle")\n' >> android/app/build.gradle

      - name: Build Android artifacts
        working-directory: android
        run: |
          if [ "${BUILD_VARIANT}" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          elif [ "${ARTIFACT_TYPE}" = "aab" ]; then
            ./gradlew :app:bundleRelease --no-daemon
          elif [ "${ARTIFACT_TYPE}" = "both" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      - name: Upload installable APK
        if: ${{ env.ARTIFACT_TYPE == 'apk' || env.ARTIFACT_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ironrise-${{ env.BUILD_VARIANT }}-apk
          path: android/app/build/outputs/apk/${{ env.BUILD_VARIANT }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android App Bundle
        if: ${{ env.ARTIFACT_TYPE == 'aab' || env.ARTIFACT_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ironrise-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
