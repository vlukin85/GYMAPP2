name: Generate signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore ironrise.keystore \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=IronRise, OU=IronRise, O=IronRise, L=Moscow, ST=Moscow, C=RU"
          ls -la ironrise.keystore

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironrise-keystore
          path: ironrise.keystore
